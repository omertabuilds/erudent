name: Bug report
description: Something is broken or wrong
labels: ["bug"]
body:
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Exactly what you did, one step per line
      placeholder: |
        1. Sign in
        2. Join ranked queue
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What should happen
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened instead
    validations:
      required: true
  - type: textarea
    id: screenshot
    attributes:
      label: Screenshot or recording
      description: Drag files in here
  - type: input
    id: device
    attributes:
      label: Device and browser
      placeholder: iPhone 15, Safari / MacBook, Chrome
    validations:
      required: true
  - type: dropdown
    id: severity
    attributes:
      label: How bad is it?
      options:
        - Breaks a match or sign-in
        - Something looks or works wrong
        - Small or cosmetic
    validations:
      required: true
